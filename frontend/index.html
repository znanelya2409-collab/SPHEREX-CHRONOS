    function buildSpectrum(profile) {
      const arr = [];
      for (let i = 0; i < 102; i++) {
        const wl = +(0.75 * Math.pow(5.0 / 0.75, i / 101)).toFixed(3);
        let base = 0.74 + 0.11 * Math.sin(i * 0.19);
        if (profile === "ch4_h2o") {
          if (Math.abs(wl - 1.4) < 0.13 || Math.abs(wl - 1.9) < 0.15 || Math.abs(wl - 2.7) < 0.18) base -= 0.34;
          if (Math.abs(wl - 3.32) < 0.22) base -= 0.38;
        } else if (profile === "red_dwarf") {
          base = 0.88 - (wl - 0.75) * 0.08 + 0.06 * Math.cos(i * 0.25);
        } else if (profile === "nh3_ch4") {
          if (Math.abs(wl - 1.52) < 0.13 || Math.abs(wl - 2.25) < 0.16) base -= 0.30;
        } else if (profile === "silicate_disk") {
          base = 0.52 + (wl / 5.0) * 0.40;
        } else if (profile === "mira_giant") {
          base = 0.80 + 0.15 * Math.sin(i * 0.12);
        }
        arr.push({ band: i + 1, wl, array: Math.min(6, Math.floor(i / 17) + 1), flux: Math.max(0.15, Math.min(0.96, base)) });
      }
      return arr;
    }

      useEffect(() => {
        if (!playing) return;
        const timer = setInterval(() => {
          setEpoch((prev) => (prev + 1) % 4);
        }, 1400 / speed);
        return () => clearInterval(timer);
      }, [playing, speed]);

      const showNotification = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(""), 3000);
      };

      // ==========================================
      // 3D СЦЕНА НЕБА (THREE.JS) С ВРАЩЕНИЕМ И ЗУМОМ
      // ==========================================
      const canvasContainerRef = useRef(null);
      const sceneStateRef = useRef({
        epoch, imgSubtraction, showCatalogs, showVectors, autoDetect, circleMode, fov, targetId, userCircles, lang
      });
      useEffect(() => {
        sceneStateRef.current = { epoch, imgSubtraction, showCatalogs, showVectors, autoDetect, circleMode, fov, targetId, userCircles, lang };
      }, [epoch, imgSubtraction, showCatalogs, showVectors, autoDetect, circleMode, fov, targetId, userCircles, lang]);

      useEffect(() => {
        const container = canvasContainerRef.current;
        if (!container) return;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 0, 7.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.innerHTML = "";
        container.appendChild(renderer.domElement);

        // Координатная 3D-сфера / сетка RA-DEC
        const gridGroup = new THREE.Group();
        const gridHelper = new THREE.GridHelper(10, 20, 0x1e293b, 0x0f172a);
        gridHelper.rotation.x = Math.PI / 2;
        gridGroup.add(gridHelper);
        scene.add(gridGroup);

        // Фоновые звезды (Gaia / WISE)
        const starsGroup = new THREE.Group();
        const bgStarsData = [];
        for (let i = 0; i < 110; i++) {
          const x = (Math.sin(i * 78.233) * 43758.5453 % 1 - 0.5) * 9.5;
          const y = (Math.cos(i * 19.13) * 19283.23 % 1 - 0.5) * 6.5;
          const z = ((i % 7) - 3) * 0.25;
          const geo = new THREE.SphereGeometry(i % 5 === 0 ? 0.045 : 0.025, 12, 12);
          const mat = new THREE.MeshBasicMaterial({ color: i % 3 === 0 ? 0x93c5fd : 0xe2e8f0 });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(x, y, z);
          mesh.userData = { type: "star", index: i };
          starsGroup.add(mesh);

          // Каталожное кольцо вокруг опорных звезд
          const ringGeo = new THREE.RingGeometry(0.08, 0.095, 24);
          const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.45 });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.position.set(x, y, z);
          starsGroup.add(ring);
          bgStarsData.push({ mesh, ring });
        }
        gridGroup.add(starsGroup);

        // Главный наблюдаемый объект (Target)
        const targetGeo = new THREE.SphereGeometry(0.13, 24, 24);
        const targetMat = new THREE.MeshBasicMaterial({ color: 0xfde68a });
        const targetMesh = new THREE.Mesh(targetGeo, targetMat);
        targetMesh.userData = { type: "target" };
        gridGroup.add(targetMesh);

        // Внешнее свечение / кольцо выделения цели
        const targetHaloGeo = new THREE.RingGeometry(0.19, 0.22, 32);
        const targetHaloMat = new THREE.MeshBasicMaterial({ color: 0xfbbf24, side: THREE.DoubleSide });
        const targetHalo = new THREE.Mesh(targetHaloGeo, targetHaloMat);
        gridGroup.add(targetHalo);

        // Пунктирная траектория собственного движения (4 эпохи)
        const lineMat = new THREE.LineDashedMaterial({ color: 0x67e8f9, dashSize: 0.12, gapSize: 0.08 });
        const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-0.6, 0.3, 0), new THREE.Vector3(0.8, -0.4, 0)]);
        const trajectoryLine = new THREE.Line(lineGeo, lineMat);
        gridGroup.add(trajectoryLine);

        // Скрытый движущийся объект для функции "Автопоиск"
        const candGeo = new THREE.SphereGeometry(0.085, 20, 20);
        const candMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e });
        const candMesh = new THREE.Mesh(candGeo, candMat);
        candMesh.userData = { type: "candidate" };
        gridGroup.add(candMesh);

        const candRingGeo = new THREE.RingGeometry(0.16, 0.20, 32);
        const candRingMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e, side: THREE.DoubleSide });
        const candRing = new THREE.Mesh(candRingGeo, candRingMat);
        gridGroup.add(candRing);

        // Группа пользовательских окружностей
        const circlesGroup = new THREE.Group();
        gridGroup.add(circlesGroup);

        // 3D Вращение мышью + Клик для рисования круга или открытия Гида новичка
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };
        let dragDistance = 0;

        const onMouseDown = (e) => {
          isDragging = true;
          dragDistance = 0;
          prevMouse = { x: e.clientX, y: e.clientY };
        };

        const onMouseMove = (e) => {
          if (!isDragging) return;
          const dx = e.clientX - prevMouse.x;
          const dy = e.clientY - prevMouse.y;
          dragDistance += Math.hypot(dx, dy);
          gridGroup.rotation.y += dx * 0.006;
          gridGroup.rotation.x += dy * 0.006;
          prevMouse = { x: e.clientX, y: e.clientY };
        };

        const onMouseUp = (e) => {
          isDragging = false;
          if (dragDistance > 6) return; // Это было 3D вращение, а не клик

          const rect = renderer.domElement.getBoundingClientRect();
          const mouse = new THREE.Vector2(
            ((e.clientX - rect.left) / rect.width) * 2 - 1,
            -((e.clientY - rect.top) / rect.height) * 2 + 1
          );
          const raycaster = new THREE.Raycaster();
          raycaster.setFromCamera(mouse, camera);

          const st = sceneStateRef.current;
          const dict = I18N[st.lang].guideDict;

          // Проверяем клик по объектам для Гида новичков
          const hits = raycaster.intersectObjects([targetMesh, candMesh, ...starsGroup.children]);
          if (hits.length > 0) {
            const hitType = hits[0].object.userData.type;
            if (hitType && dict[hitType]) {
              setGuideModal(dict[hitType]);
              return;
            }
          }

          // Если включен инструмент "Рисование окружности", ставим круг в точку клика на плоскости неба
          if (st.circleMode) {
            const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
            const pt = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, pt);
            gridGroup.worldToLocal(pt);
            setUserCircles((prev) => [...prev, { id: Date.now(), x: pt.x, y: pt.y, z: pt.z }]);
            setGuideModal(dict.circle);
          }
        };

        const dom = renderer.domElement;
        dom.addEventListener("mousedown", onMouseDown);
        window.addEventListener("mousemove", onMouseMove);
        window.addEventListener("mouseup", onMouseUp);

        let animId;
        const animate = () => {
          animId = requestAnimationFrame(animate);
          const st = sceneStateRef.current;
          const curTarget = FALLBACK_TARGETS[st.targetId];

          // Масштаб FOV
          const zoomScale = 1.0 / Math.sqrt(st.fov);
          gridGroup.scale.set(zoomScale, zoomScale, zoomScale);

          // Вычитание кадров (Image Subtraction): неподвижные звезды гаснут, движущиеся ярко горят!
          bgStarsData.forEach(({ mesh, ring }) => {
            mesh.visible = !st.imgSubtraction;
            ring.visible = st.showCatalogs && !st.imgSubtraction;
          });

          // Позиция главного объекта в зависимости от выбранной эпохи (0..3)
          const tNorm = (st.epoch - 1.5) * 0.42;
          const dirX = curTarget.pm_ra < 0 ? 1 : -1;
          const dirY = curTarget.pm_dec < 0 ? -1 : 1;
          const tx = tNorm * dirX * (Math.abs(curTarget.pm_ra) > 0.2 ? 1.1 : 0.15);
          const ty = tNorm * dirY * (Math.abs(curTarget.pm_dec) > 0.2 ? 0.75 : 0.15);

          // Изменение размера от кривой блеска
          const fluxScale = curTarget.light_curve[st.epoch] || 1.0;
          targetMesh.position.set(tx, ty, 0.05);
          targetMesh.scale.setScalar(fluxScale);
          targetHalo.position.set(tx, ty, 0.05);
          targetHalo.rotation.z += 0.02;

          // Вектор траектории
          trajectoryLine.visible = st.showVectors;
          const startPt = new THREE.Vector3(-1.5 * 0.42 * dirX * (Math.abs(curTarget.pm_ra) > 0.2 ? 1.1 : 0.15), -1.5 * 0.42 * dirY * (Math.abs(curTarget.pm_dec) > 0.2 ? 0.75 : 0.15), 0.04);
          const endPt = new THREE.Vector3(1.5 * 0.42 * dirX * (Math.abs(curTarget.pm_ra) > 0.2 ? 1.1 : 0.15), 1.5 * 0.42 * dirY * (Math.abs(curTarget.pm_dec) > 0.2 ? 0.75 : 0.15), 0.04);
          trajectoryLine.geometry.setFromPoints([startPt, endPt]);
          trajectoryLine.computeLineDistances();

          // Автопоиск движущихся объектов (показывает скрытого кандидата)
          candMesh.visible = st.autoDetect || st.imgSubtraction;
          candRing.visible = st.autoDetect;
          const cx = -1.1 + st.epoch * 0.48;
          const cy = 0.85 - st.epoch * 0.34;
          candMesh.position.set(cx, cy, 0.08);
          candRing.position.set(cx, cy, 0.08);
          candRing.scale.setScalar(1 + 0.15 * Math.sin(Date.now() * 0.008));

          // Перерисовка пользовательских окружностей
          while (circlesGroup.children.length > 0) circlesGroup.remove(circlesGroup.children[0]);
          st.userCircles.forEach((c) => {
            const uRingGeo = new THREE.RingGeometry(0.22, 0.25, 32);
            const uRingMat = new THREE.MeshBasicMaterial({ color: 0x34d399, side: THREE.DoubleSide });
            const uRing = new THREE.Mesh(uRingGeo, uRingMat);
            uRing.position.set(c.x, c.y, c.z + 0.06);
            circlesGroup.add(uRing);
          });

          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!container) return;
          camera.aspect = container.clientWidth / container.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(container.clientWidth, container.clientHeight);
        };
        window.addEventListener("resize", handleResize);

        return () => {
          cancelAnimationFrame(animId);
          dom.removeEventListener("mousedown", onMouseDown);
          window.removeEventListener("mousemove", onMouseMove);
          window.removeEventListener("mouseup", onMouseUp);
          window.removeEventListener("resize", handleResize);
        };
      }, []);

      // Экспорт JSON открытия
      const handleExportDiscovery = () => {
        const report = {
          mission: "NASA SPHEREx 2026",
          target: target.name,
          ra: raInput,
          dec: decInput,
          epoch_observed: epochsLabels[epoch],
          classification: t.classOptions[discoveryClass],
          circled_coordinates: userCircles,
          contamination_flag: target.flag
        };
        const blob = new Blob([JSON.stringify(report, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `SPHEREx_Discovery_${target.id}.json`;
        a.click();
        showNotification(t.loggedOk);
      };

      const selectedBand = spectrum[selectedBandIdx] || spectrum[32];

      return (
        <div className="min-h-screen flex flex-col justify-between p-3 gap-3 select-none">
          {/* ВЕРХНЯЯ ПАНЕЛЬ НАВИГАЦИИ */}
          <header className="glass-panel rounded-xl px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 neon-border">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-lg bg-indigo-600/30 border border-indigo-400/50 flex items-center justify-center text-indigo-300 font-bold text-lg">
                ✦
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-extrabold tracking-wide text-white text-base">SPHEREX <span className="text-indigo-400">CHRONOS</span></span>
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">102-BAND LIVE</span>
                </div>
                <p className="text-[11px] text-slate-400">{t.subtitle}</p>
              </div>
            </div>

            {/* Координаты RA / DEC и Поиск */}
            <div className="flex flex-wrap items-center gap-2">
              <div className="flex items-center bg-slate-900/90 border border-slate-700 rounded-lg px-2.5 py-1 text-xs">
                <span className="text-slate-400 mr-1.5">RA:</span>
                <input value={raInput} onChange={(e) => setRaInput(e.target.value)} className="bg-transparent text-cyan-300 font-mono w-28 focus:outline-none" />
              </div>
              <div className="flex items-center bg-slate-900/90 border border-slate-700 rounded-lg px-2.5 py-1 text-xs">
                <span className="text-slate-400 mr-1.5">DEC:</span>
                <input value={decInput} onChange={(e) => setDecInput(e.target.value)} className="bg-transparent text-cyan-300 font-mono w-28 focus:outline-none" />
              </div>
              <button onClick={() => showNotification(`${raInput} | ${decInput}`)} className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3.5 py-1.5 rounded-lg transition">
                🔍 {t.searchBtn}
              </button>
              <button onClick={() => { navigator.clipboard.writeText(window.location.href); showNotification(t.copied); }} className="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 text-xs px-3 py-1.5 rounded-lg transition">
                🔗 {t.shareBtn}
              </button>

              {/* Переключатель 3 языков: Қазақша / Русский / English */}
              <div className="flex bg-slate-900 border border-slate-700 rounded-lg p-0.5 text-xs font-bold">
                {["kk", "ru", "en"].map((code) => (
                  <button
                    key={code}
                    onClick={() => setLang(code)}
                    className={`px-2.5 py-1 rounded-md uppercase transition ${lang === code ? "bg-indigo-600 text-white" : "text-slate-400 hover:text-white"}`}
                  >
                    {code === "kk" ? "ҚАЗ" : code === "ru" ? "РУС" : "ENG"}
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* ПАНЕЛЬ БЫСТРОГО ВЫБОРА 5 ОБЪЕКТОВ ИЗ ЗАДАНИЯ NASA */}
          <div className="flex flex-wrap items-center gap-2">
            {Object.values(FALLBACK_TARGETS).map((item) => (
              <button
                key={item.id}
                onClick={() => handleSelectTarget(item.id)}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold border transition flex items-center gap-2 ${
                  targetId === item.id
                    ? "bg-indigo-600/30 border-indigo-400 text-white shadow-md shadow-indigo-500/20"
                    : "glass-panel text-slate-300 hover:border-slate-500"
                }`}
              >
                <span>{item.name}</span>
                <span className="text-[10px] px-1.5 py-0.2 rounded bg-slate-800 text-slate-400">{item.flag.split(" ")[0]}</span>
              </button>
            ))}
          </div>

          {/* ОСНОВНАЯ РАБОЧАЯ ОБЛАСТЬ (3 КОЛОНКИ КАК НА СКРИНШОТЕ) */}
          <main className="grid grid-cols-1 lg:grid-cols-12 gap-3 flex-1">
            
            {/* ЛЕВАЯ КОЛОНКА: Карточка объекта, Интересный факт, Режимы анализа, Кривая блеска */}
            <aside className="lg:col-span-3 glass-panel rounded-xl p-3.5 flex flex-col justify-between gap-3">
              <div>
                <div className="flex justify-between items-start text-[10px] text-indigo-300 font-bold tracking-wider uppercase">
                  <span>{t.astroObject}</span>
                  <span className="font-mono text-slate-400">{target.ra_deg}° | {target.dec_deg}°</span>
                </div>
                <h2 className="text-base font-bold text-white mt-0.5">{target.name}</h2>
                <p className="text-xs text-slate-400">{target.category[lang]}</p>

                <div className="mt-2 px-2.5 py-1.5 rounded-lg bg-emerald-950/60 border border-emerald-500/30 text-emerald-300 text-xs font-medium">
                  🧪 {target.molecules}
                </div>

                {/* Окошко с интересными научными фактами о выбранном объекте */}
                <div className="mt-2.5 p-2.5 rounded-lg bg-amber-500/10 border border-amber-400/30">
                  <div className="text-[10px] font-bold text-amber-300 uppercase mb-1">💡 {t.funFactTitle}</div>
                  <p className="text-[11px] leading-relaxed text-amber-100/90">{target.fact[lang]}</p>
                </div>
              </div>

              {/* Режимы анализа */}
              <div className="space-y-2">
                <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">{t.analysisModes}</div>
                
                <button onClick={() => setImgSubtraction(!imgSubtraction)} className={`w-full flex justify-between items-center px-3 py-2 rounded-lg text-xs font-medium border transition ${imgSubtraction ? "bg-rose-500/20 border-rose-400 text-rose-200" : "bg-slate-900/70 border-slate-700 text-slate-300"}`}>
                  <span>👁 {t.imgSub}</span>
                  <span className="font-bold">{imgSubtraction ? "ON" : "OFF"}</span>
                </button>

                <button onClick={() => setShowCatalogs(!showCatalogs)} className={`w-full flex justify-between items-center px-3 py-2 rounded-lg text-xs font-medium border transition ${showCatalogs ? "bg-sky-500/20 border-sky-400 text-sky-200" : "bg-slate-900/70 border-slate-700 text-slate-300"}`}>
                  <span>🗂 {t.catalogs}</span>
                  <span className="font-bold">{showCatalogs ? "ON" : "OFF"}</span>
                </button>

                <button onClick={() => setShowVectors(!showVectors)} className={`w-full flex justify-between items-center px-3 py-2 rounded-lg text-xs font-medium border transition ${showVectors ? "bg-emerald-500/20 border-emerald-400 text-emerald-200" : "bg-slate-900/70 border-slate-700 text-slate-300"}`}>
                  <span>↗ {t.pmVectors}</span>
                  <span className="font-bold">{showVectors ? "ON" : "OFF"}</span>
                </button>

                <button onClick={() => { const next = !autoDetect; setAutoDetect(next); if (next) showNotification(t.autoFoundMsg); }} className={`w-full flex justify-between items-center px-3 py-2 rounded-lg text-xs font-medium border transition ${autoDetect ? "bg-amber-500/25 border-amber-400 text-amber-200" : "bg-slate-900/70 border-slate-700 text-slate-300"}`}>
                  <span>🎯 {t.autoDetect}</span>
                  <span className="font-bold">{autoDetect ? "ACTIVE" : "SCAN"}</span>
                </button>

                <div className="flex gap-1.5">
                  <button onClick={() => setCircleMode(!circleMode)} className={`flex-1 flex justify-between items-center px-3 py-2 rounded-lg text-xs font-medium border transition ${circleMode ? "bg-indigo-500/25 border-indigo-400 text-indigo-200" : "bg-slate-900/70 border-slate-700 text-slate-300"}`}>
                    <span>⭕ {t.circleTool}</span>
                  </button>
                  {userCircles.length > 0 && (
                    <button onClick={() => setUserCircles([])} className="px-2.5 py-2 rounded-lg bg-slate-800 text-xs text-slate-300 hover:text-white" title="Clear circles">✕</button>
                  )}
                </div>

                {/* Слайдер FOV */}
                <div className="pt-1">
                  <div className="flex justify-between text-xs text-slate-300 mb-1">
                    <span>{t.fovLabel}</span>
                    <span className="font-mono text-indigo-300">{fov.toFixed(1)}° × {fov.toFixed(1)}°</span>
                  </div>
                  <input type="range" min="0.5" max="3.0" step="0.1" value={fov} onChange={(e) => setFov(parseFloat(e.target.value))} className="w-full" />
                </div>
              </div>

              {/* Кривые блеска (Light Curve) по эпохам + SVG график */}
              <div onClick={() => setGuideModal(t.guideDict.lightcurve)} className="cursor-pointer bg-slate-900/80 border border-slate-700/80 rounded-lg p-2.5 hover:border-indigo-400/50 transition">
                <div className="flex justify-between items-center text-xs mb-1.5">
                  <span className="font-semibold text-slate-200">📈 {t.lightCurve}</span>
                  <span className="font-mono text-indigo-400 font-bold">{target.light_curve[epoch].toFixed(3)}x</span>
                </div>
                <svg viewBox="0 0 200 42" className="w-full h-9 mb-1.5 overflow-visible">
                  <polyline
                    fill="none"
                    stroke="#818cf8"
                    strokeWidth="2.5"
                    points={target.light_curve.map((v, i) => `${20 + i * 53},${38 - (v - 0.5) * 32}`).join(" ")}
                  />
                  {target.light_curve.map((v, i) => (
                    <circle key={i} cx={20 + i * 53} cy={38 - (v - 0.5) * 32} r={epoch === i ? 4.5 : 3} fill={epoch === i ? "#38bdf8" : "#818cf8"} />
                  ))}
                </svg>
                <div className="grid grid-cols-4 gap-1 text-center">
                  {target.light_curve.map((val, idx) => (
                    <div key={idx} className={`py-1 rounded text-[10px] font-mono ${epoch === idx ? "bg-indigo-600 text-white font-bold" : "bg-slate-800 text-slate-400"}`}>
                      <div>Ep {idx + 1}</div>
                      <div>{val}</div>
                    </div>
                  ))}
                </div>
              </div>
            </aside>

            {/* ЦЕНТРАЛЬНАЯ 3D-ОБЛАСТЬ НЕБА (THREE.JS) */}
            <section className="lg:col-span-6 glass-panel rounded-xl relative overflow-hidden min-h-[430px] flex flex-col justify-between neon-border">
              <div ref={canvasContainerRef} className="absolute inset-0 cursor-crosshair" />

              {/* Подсказка для новичков сверху холста */}
              <div className="relative z-10 m-3 flex justify-between items-center pointer-events-none">
                <span className="px-3 py-1 rounded-full bg-slate-950/80 border border-slate-700 text-[11px] text-slate-300">
                  🧭 3D Drag to Rotate • Click Object for Beginner Guide
                </span>
                <span className="px-2.5 py-1 rounded bg-slate-950/80 border border-slate-700 text-[11px] font-mono text-cyan-300">
                  {epochsLabels[epoch]}
                </span>
              </div>

              {/* Модальное мини-окно "Гид для новичков" при клике на элемент */}
              {guideModal && (
                <div className="relative z-20 m-4 p-4 rounded-xl bg-slate-950/95 border border-indigo-400 shadow-2xl max-w-md self-center">
                  <div className="flex justify-between items-center mb-1">
                    <span className="text-[10px] uppercase font-bold tracking-wider text-indigo-400">🎓 {t.guideTitle}</span>
                    <button onClick={() => setGuideModal(null)} className="text-xs text-slate-400 hover:text-white">✕ {t.close}</button>
                  </div>
                  <h4 className="text-sm font-bold text-white mb-1">{guideModal.title}</h4>
                  <p className="text-xs text-slate-300 leading-relaxed">{guideModal.desc}</p>
                </div>
              )}

              <div className="relative z-10 m-3 text-[11px] text-slate-400 pointer-events-none">
                💡 {t.beginnerHint}
              </div>
            </section>

            {/* ПРАВАЯ КОЛОНКА: 102-Band ИК Спектрометр и Журнал открытий */}
            <aside className="lg:col-span-3 glass-panel rounded-xl p-3.5 flex flex-col justify-between gap-3">
              <div>
                <div className="flex justify-between items-center mb-2">
                  <span className="text-xs font-bold text-slate-200">〰 {t.spectrometer}</span>
                  <span className="px-2 py-0.5 rounded bg-amber-500/20 border border-amber-400/40 text-amber-300 font-mono text-xs font-bold">
                    {selectedBand.wl} µm
                  </span>
                </div>

                {/* 6 детекторных решеток SPHEREx */}
                <div className="grid grid-cols-3 gap-1.5 mb-2.5">
                  {[
                    { id: 1, range: "0.75-1.11 µm" },
                    { id: 2, range: "1.11-1.64 µm" },
                    { id: 3, range: "1.64-2.42 µm" },
                    { id: 4, range: "2.42-3.82 µm" },
                    { id: 5, range: "3.82-4.42 µm" },
                    { id: 6, range: "4.42-5.00 µm" }
                  ].map((arr) => (
                    <button
                      key={arr.id}
                      onClick={() => { setActiveArray(arr.id); setSelectedBandIdx((arr.id - 1) * 17 + 8); }}
                      className={`p-1.5 rounded-lg border text-left transition ${
                        activeArray === arr.id ? "bg-amber-500/20 border-amber-400 text-amber-200" : "bg-slate-900/70 border-slate-700 text-slate-400"
                      }`}
                    >
                      <div className="text-[11px] font-bold">Array {arr.id}</div>
                      <div className="text-[9px] font-mono">{arr.range}</div>
                    </button>
                  ))}
                </div>

                <div className="px-2.5 py-1 rounded bg-amber-500/10 border border-amber-500/30 text-[11px] text-amber-300 mb-2">
                  {t.activeBand}: <span className="font-bold">{target.molecules}</span>
                </div>

                {/* Интерактивный график 102 спектральных полос (Спектр по клику) */}
                <div
                  onClick={() => setGuideModal(t.guideDict.spectrum)}
                  className="bg-slate-950/90 border border-slate-800 rounded-lg p-2.5 cursor-pointer hover:border-amber-400/50 transition"
                >
                  <svg viewBox="0 0 306 100" className="w-full h-28">
                    <polyline
                      fill="none"
                      stroke="#f59e0b"
                      strokeWidth="2"
                      points={spectrum.map((b, i) => `${i * 3},${95 - b.flux * 85}`).join(" ")}
                    />
                    <line x1={selectedBandIdx * 3} y1="0" x2={selectedBandIdx * 3} y2="100" stroke="#38bdf8" strokeDasharray="3,3" strokeWidth="1.5" />
                    <circle cx={selectedBandIdx * 3} cy={95 - selectedBand.flux * 85} r="4" fill="#38bdf8" />
                  </svg>
                  <div className="flex justify-between text-[10px] font-mono text-slate-400 mt-1">
                    <span>0.75 µm (Band 1)</span>
                    <span className="text-cyan-300">Band #{selectedBand.band}</span>
                    <span>5.00 µm (Band 102)</span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="101"
                    value={selectedBandIdx}
                    onChange={(e) => {
                      const idx = parseInt(e.target.value);
                      setSelectedBandIdx(idx);
                      setActiveArray(spectrum[idx].array);
                    }}
                    className="w-full mt-2"
                  />
                </div>
              </div>

              {/* Журнал открытий гражданской науки */}
              <div className="bg-slate-900/80 border border-slate-700/80 rounded-lg p-3 space-y-2">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-bold text-slate-200">🚩 {t.discoveryLog}</span>
                  <button onClick={handleExportDiscovery} className="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-600 text-[10px] text-slate-200">
                    ⬇ {t.exportJson}
                  </button>
                </div>
                <select
                  value={discoveryClass}
                  onChange={(e) => setDiscoveryClass(parseInt(e.target.value))}
                  className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none"
                >
                  {t.classOptions.map((opt, idx) => (
                    <option key={idx} value={idx}>{opt}</option>
                  ))}
                </select>
                <button onClick={handleExportDiscovery} className="w-full py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition">
                  ✓ {t.logBtn} ({userCircles.length} ⭕)
                </button>
              </div>
            </aside>
          </main>

          {/* НИЖНИЙ ТАЙМЛАЙН (4 ЭПОХИ SPHEREX 2025–2026) */}
          <footer className="glass-panel rounded-xl px-4 py-2.5 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center gap-2">
              <button
                onClick={() => setPlaying(!playing)}
                className="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold flex items-center gap-1.5"
              >
                {playing ? "⏸ PAUSE" : "▶ PLAY"}
              </button>
              <select
                value={speed}
                onChange={(e) => setSpeed(parseFloat(e.target.value))}
                className="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-200"
              >
                <option value="0.5">0.5x</option>
                <option value="1">1.0x</option>
                <option value="2">2.0x</option>
              </select>
            </div>

            {/* Шкала времени по 4 эпохам */}
            <div className="flex-1 min-w-[260px]">
              <div className="grid grid-cols-4 text-center text-[11px] font-mono mb-1">
                {epochsLabels.map((lbl, idx) => (
                  <button
                    key={idx}
                    onClick={() => { setPlaying(false); setEpoch(idx); }}
                    className={`transition ${epoch === idx ? "text-indigo-400 font-bold" : "text-slate-400 hover:text-slate-200"}`}
                  >
                    {lbl}
                  </button>
                ))}
              </div>
              <input
                type="range"
                min="0"
                max="3"
                step="1"
                value={epoch}
                onChange={(e) => { setPlaying(false); setEpoch(parseInt(e.target.value)); }}
                className="w-full"
              />
            </div>

            {/* Астрометрический сдвиг в реальном времени */}
            <div className="text-right text-xs font-mono">
              <div className="text-[10px] text-slate-400">{t.astrometryShift}:</div>
              <div className="text-emerald-400 font-bold">
                ΔRA: {(target.pm_ra * epoch * 0.5).toFixed(2)}" | ΔDec: {(target.pm_dec * epoch * 0.5).toFixed(2)}"
              </div>
            </div>
          </footer>

          {/* Всплывающее уведомление */}
          {toast && (
            <div className="fixed bottom-20 right-5 z-50 bg-indigo-600 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-xl border border-indigo-400">
              {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
